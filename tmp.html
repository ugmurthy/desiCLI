"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Pomo-VX: Neon Glassmorphism Pomodoro Clock</title>\n  <style>\n    * {\n      margin: 0;\n      padding: 0;\n      box-sizing: border-box;\n    }\n\n    body {\n      height: 100vh;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0f0f23 100%);\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n      overflow: hidden;\n      position: relative;\n    }\n\n    body::before {\n      content: '';\n      position: absolute;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 100%;\n      background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),\n                          radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),\n                          radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);\n      pointer-events: none;\n      z-index: 1;\n      animation: float 20s ease-in-out infinite;\n    }\n\n    @keyframes float {\n      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }\n      50% { transform: scale(1.05) rotate(180deg); opacity: 1; }\n    }\n\n    .container {\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      z-index: 2;\n    }\n\n    .glass-card {\n      backdrop-filter: blur(25px) saturate(180%);\n      background: rgba(255, 255, 255, 0.08);\n      border: 1px solid rgba(255, 255, 255, 0.15);\n      border-radius: 32px;\n      padding: 3rem 2.5rem;\n      text-align: center;\n      box-shadow: \n        0 25px 50px rgba(0, 0, 0, 0.4),\n        inset 0 1px 0 rgba(255, 255, 255, 0.2);\n      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);\n      max-width: 90vw;\n      position: relative;\n    }\n\n    .glass-card:hover {\n      transform: translateY(-8px);\n      box-shadow: \n        0 35px 70px rgba(0, 0, 0, 0.5),\n        inset 0 1px 0 rgba(255, 255, 255, 0.3);\n    }\n\n    #mode {\n      font-size: 1.5rem;\n      font-weight: 600;\n      margin-bottom: 1rem;\n      letter-spacing: 2px;\n      color: #ffffff;\n      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);\n      transition: all 0.3s ease;\n    }\n\n    .work #mode {\n      color: #ff6b6b;\n      text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;\n    }\n\n    .break #mode {\n      color: #51cf66;\n      text-shadow: 0 0 20px #51cf66, 0 0 40px #51cf66;\n    }\n\n    #timer {\n      font-size: clamp(3.5rem, 10vw, 6rem);\n      font-weight: 700;\n      font-variant-numeric: tabular-nums;\n      color: #ffffff;\n      text-shadow: \n        0 0 20px rgba(0, 255, 255, 0.8),\n        0 0 40px rgba(0, 255, 255, 0.4);\n      margin: 1.5rem 0 2rem;\n      letter-spacing: -2px;\n      transition: all 0.3s ease;\n    }\n\n    .controls {\n      display: flex;\n      justify-content: center;\n      gap: 1.5rem;\n    }\n\n    .controls button {\n      width: 70px;\n      height: 70px;\n      border: none;\n      background: rgba(255, 255, 255, 0.05);\n      backdrop-filter: blur(10px);\n      border-radius: 50%;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);\n      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);\n      position: relative;\n      overflow: hidden;\n    }\n\n    .controls button::before {\n      content: '';\n      position: absolute;\n      top: 0;\n      left: -100%;\n      width: 100%;\n      height: 100%;\n      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);\n      transition: left 0.5s;\n    }\n\n    .controls button:hover::before {\n      left: 100%;\n    }\n\n    .controls button:hover {\n      transform: scale(1.1) translateY(-3px);\n      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);\n    }\n\n    .controls button:active {\n      transform: scale(0.95);\n    }\n\n    svg {\n      width: 28px;\n      height: 28px;\n      stroke-width: 2;\n      stroke-linejoin: round;\n      stroke-linecap: round;\n      filter: drop-shadow(0 0 8px currentColor);\n      transition: filter 0.3s ease;\n    }\n\n    #play svg { stroke: #00ffff; filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #00ffff); }\n    #pause svg { stroke: #ffd43b; filter: drop-shadow(0 0 10px #ffd43b) drop-shadow(0 0 20px #ffd43b); }\n    #reset svg { stroke: #ff00ff; filter: drop-shadow(0 0 10px #ff00ff) drop-shadow(0 0 20px #ff00ff); }\n\n    .controls button:hover svg {\n      filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 30px currentColor);\n    }\n\n    @media (max-width: 480px) {\n      .glass-card {\n        padding: 2rem 1.5rem;\n        border-radius: 24px;\n      }\n      .controls {\n        gap: 1rem;\n      }\n      .controls button {\n        width: 60px;\n        height: 60px;\n      }\n      svg {\n        width: 24px;\n        height: 24px;\n      }\n    }\n\n    .running #timer {\n      animation: pulse 1s infinite;\n    }\n\n    @keyframes pulse {\n      0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.4); }\n      50% { text-shadow: 0 0 30px rgba(0, 255, 255, 1), 0 0 60px rgba(0, 255, 255, 0.6); }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"container\">\n    <div class=\"glass-card\" id=\"glassCard\">\n      <div id=\"mode\">Work</div>\n      <div id=\"timer\">25:00</div>\n      <div class=\"controls\">\n        <button id=\"play\" title=\"Start / Resume\">\n          <svg viewBox=\"0 0 24 24\">\n            <polygon points=\"5,3 5,21 16,12\"></polygon>\n          </svg>\n        </button>\n        <button id=\"pause\" title=\"Pause\">\n          <svg viewBox=\"0 0 24 24\">\n            <rect x=\"6\" y=\"4\" width=\"4\" height=\"16\"></rect>\n            <rect x=\"14\" y=\"4\" width=\"4\" height=\"16\"></rect>\n          </svg>\n        </button>\n        <button id=\"reset\" title=\"Reset\">\n          <svg viewBox=\"0 0 24 24\">\n            <path d=\"M23 4v6h-6\"></path>\n            <path d=\"M1 20v-6h6\"></path>\n            <path d=\"M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15\"></path>\n          </svg>\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <script>\n    class PomodoroClock {\n      constructor() {\n        this.time = 25 * 60;\n        this.isRunning = false;\n        this.interval = null;\n        this.isWork = true;\n        this.audioCtx = null;\n\n        this.elements = {\n          glassCard: document.getElementById('glassCard'),\n          mode: document.getElementById('mode'),\n          timer: document.getElementById('timer'),\n          play: document.getElementById('play'),\n          pause: document.getElementById('pause'),\n          reset: document.getElementById('reset')\n        };\n\n        this.bindEvents();\n        this.updateDisplay();\n      }\n\n      bindEvents() {\n        this.elements.play.onclick = () => this.toggle();\n        this.elements.pause.onclick = () => this.pause();\n        this.elements.reset.onclick = () => this.reset();\n      }\n\n      updateDisplay() {\n        const min = Math.floor(this.time / 60);\n        const sec = this.time % 60;\n        this.elements.timer.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;\n        this.elements.mode.textContent = this.isWork ? 'Work' : 'Break';\n        this.elements.glassCard.className = this.isWork ? 'glass-card work' : 'glass-card break';\n      }\n\n      toggle() {\n        if (this.isRunning) {\n          this.pause();\n        } else {\n          this.start();\n        }\n      }\n\n      start() {\n        if (!this.isRunning) {\n          this.elements.glassCard.classList.add('running');\n          this.interval = setInterval(() => {\n            this.time--;\n            this.updateDisplay();\n            if (this.time <= 0) {\n              this.switchSession();\n            }\n          }, 1000);\n          this.isRunning = true;\n        }\n      }\n\n      pause() {\n        if (this.isRunning) {\n          clearInterval(this.interval);\n          this.isRunning = false;\n          this.elements.glassCard.classList.remove('running');\n        }\n      }\n\n      reset() {\n        this.pause();\n        this.isWork = true;\n        this.time = 25 * 60;\n        this.updateDisplay();\n      }\n\n      switchSession() {\n        this.isWork = !this.isWork;\n        this.time = this.isWork ? 25 * 60 : 5 * 60;\n        this.updateDisplay();\n        this.playBeep();\n      }\n\n      playBeep() {\n        if (!this.audioCtx) {\n          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        }\n        const oscillator = this.audioCtx.createOscillator();\n        const gainNode = this.audioCtx.createGain();\n        oscillator.connect(gainNode);\n        gainNode.connect(this.audioCtx.destination);\n        oscillator.frequency.value = this.isWork ? 800 : 600;\n        oscillator.type = 'sine';\n        gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);\n        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.6);\n        oscillator.start(this.audioCtx.currentTime);\n        oscillator.stop(this.audioCtx.currentTime + 0.6);\n      }\n    }\n\n    // Initialize\n    new PomodoroClock();\n  </script>\n</body>\n</html>"
